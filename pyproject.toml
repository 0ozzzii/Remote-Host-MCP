[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-host-mcp"
version = "0.2.0a4"
description = "General-purpose MCP server for AI-controlled remote Linux hosts and containers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]==2.2.0",
  "pexpect>=4.9,<5",
  "pyte>=0.8.2,<1",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.26,<1",
]

[project.scripts]
remote-host-mcp = "remote_host_mcp.main:main"
remote-host-mcp-doctor = "remote_host_mcp.doctor:main"
remote-host-mcp-report = "remote_host_mcp.report_agent:main"
dsw-direct-mcp = "remote_host_mcp.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
