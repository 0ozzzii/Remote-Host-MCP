name: Alpha3 SSH and artifact apply

on:
  push:
    branches:
      - hardening/audit-closure-20260913

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair and apply one-shot transformation
        run: |
          python scripts/fix_alpha3_transformer.py
          python scripts/apply_alpha3_ssh_artifacts.py
          python scripts/finalize_alpha3_transform.py

      - name: Keep workflow files for connector-managed cleanup
        run: |
          git checkout HEAD -- .github/workflows/alpha3-feature-apply.yml
          git checkout HEAD -- .github/workflows/validation.yml

      - name: Install candidate and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          pip check

      - name: Focused SSH and artifact tests
        run: pytest -q --tb=short tests/test_remote_artifacts_ssh.py

      - name: Audit regressions
        run: pytest -q --tb=short tests/test_audit_closure.py tests/test_process_redaction.py tests/test_process_redaction_tail.py tests/test_service_diagnostics.py

      - name: Full pytest suite
        run: pytest -q --tb=short

      - name: Compile package
        run: python -m compileall -q src tests

      - name: Static SSH credential and secret hygiene
        run: |
          set -euo pipefail
          ! grep -R --include='*.py' -n -E 'sshpass|StrictHostKeyChecking=no|PasswordAuthentication=yes|KbdInteractiveAuthentication=yes' src tests
          ! grep -R --include='*.py' -n -E '/proc/.*/environ|pkill[[:space:]]+-f' src tests
          python - <<'PY'
          import json
          tools=json.load(open('tests/tool_manifest.json', encoding='utf-8'))
          assert len(tools) == 48
          for name in ['file_artifact','ssh_check','ssh_exec','ssh_upload','ssh_download']:
              assert name in tools
          PY

      - name: Commit validated alpha3 candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'feat: add strict SSH and direct MCP artifacts'
          git push origin HEAD:hardening/audit-closure-20260913
