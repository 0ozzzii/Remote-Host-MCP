name: Build and Release Standalone Runtime Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag name to upload artifacts to (e.g. v0.2.0a4, leave empty to test build only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-linux-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for build tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Build standard wheel package
        run: |
          python -m build --wheel
          ls -la dist/

      - name: Build standalone portable Linux x86_64 runtime
        run: |
          chmod +x scripts/package-runtime.sh
          ./scripts/package-runtime.sh
          ls -la dist/

      - name: Verify portable runtime in clean container
        run: |
          docker run --rm -v "$(pwd)/dist:/dist:ro" ubuntu:22.04 bash -lc '
            set -euo pipefail
            mkdir -p /test-runtime
            tar -xzf /dist/rhmcp-runtime-linux-x86_64.tar.gz -C /test-runtime
            test -x /test-runtime/bin/remote-host-mcp
            echo "Testing entrypoint without system python:"
            /test-runtime/bin/remote-host-mcp --help || true
            echo "Clean container verification succeeded!"
          '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rhmcp-release-assets
          path: |
            dist/rhmcp-runtime-linux-x86_64.tar.gz
            dist/rhmcp-runtime-linux-x86_64.tar.gz.sha256
            dist/*.whl

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            dist/rhmcp-runtime-linux-x86_64.tar.gz
            dist/rhmcp-runtime-linux-x86_64.tar.gz.sha256
            dist/*.whl
          generate_release_notes: true
          draft: false
          prerelease: false
