name: Remote Host MCP release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify tag and project version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '\r\n' < VERSION)"
          test "$tag" = "$version"
      - name: Install release validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install 'build>=1.2,<2' 'twine>=6,<7'
          pip check
      - name: Run acceptance tests
        run: |
          pytest -q --tb=short
          python -m compileall -q src tests scripts/secret_scan.py
          python scripts/secret_scan.py --git-history
      - name: Build release artifacts
        run: |
          python -m build
          python -m twine check dist/*
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes --title "Remote Host MCP ${GITHUB_REF_NAME}")
          if [[ "$GITHUB_REF_NAME" =~ (alpha|beta|rc) ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS "${args[@]}"
