name: Bootstrap Remote Host MCP 0.1.0-alpha.1

on:
  push:
    branches:
      - migration/bootstrap-0.1.0-alpha.1
    paths:
      - ".github/workflows/bootstrap-import.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/bootstrap-0.1.0-alpha.1
      - name: Test access to old private-repo source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -L -o "$RUNNER_TEMP/old-source.zip" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/0ozzzii/cf-remote-mcp/actions/artifacts/10296104172/zip)
          echo "old-artifact-http=$code"
          test "$code" = "200"
          unzip -l "$RUNNER_TEMP/old-source.zip"
