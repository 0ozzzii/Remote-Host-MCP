name: Agent native ops apply

on:
  push:
    branches:
      - feature/agent-native-ops-20260913

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply one-shot version and surface transform
        run: python scripts/apply_agent_ops_surface.py

      - name: Keep workflow files connector-managed
        run: |
          git checkout HEAD -- .github/workflows/agent-native-ops-apply.yml
          git checkout HEAD -- .github/workflows/validation.yml
          git checkout HEAD -- .github/workflows/alpha3-feature-apply.yml

      - name: Install candidate and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          pip check

      - name: Focused agent-native tests
        run: pytest -q --tb=short tests/test_agent_ops.py

      - name: MCP contract tests
        run: pytest -q --tb=short tests/test_openai_mcp_contract.py tests/test_mature.py::test_mature_mcp_tool_contract

      - name: Prior security and alpha3 regressions
        run: |
          pytest -q --tb=short \
            tests/test_audit_closure.py \
            tests/test_process_redaction.py \
            tests/test_process_redaction_tail.py \
            tests/test_service_diagnostics.py \
            tests/test_remote_artifacts_ssh.py

      - name: Full pytest suite
        run: pytest -q --tb=short

      - name: Compile package
        run: python -m compileall -q src tests

      - name: Static agent safety and exact surface
        run: |
          set -euo pipefail
          ! grep -R --include='*.py' -n -E 'pkill[[:space:]]+-f|/proc/.*/environ' src tests
          ! grep -R --include='*.py' -n -E 'shell[[:space:]]*=[[:space:]]*True' src/remote_host_mcp/agent_ops.py src/remote_host_mcp/agent_surface.py
          ! grep -R --include='*.py' -n -E 'StrictHostKeyChecking=no|sshpass' src tests
          python - <<'PY'
          import json
          from remote_host_mcp import __version__
          assert __version__ == '0.2.0a4'
          assert open('VERSION', encoding='utf-8').read().strip() == '0.2.0-alpha.4'
          tools = json.load(open('tests/tool_manifest.json', encoding='utf-8'))
          assert len(tools) == len(set(tools)) == 65
          required = {
              'host_capabilities','wait_condition','artifact_info','artifact_preview','artifact_bundle','exec_argv',
              'snapshot_create','snapshot_list','snapshot_restore','snapshot_delete',
              'lease_acquire','lease_status','lease_list','lease_release','inspect_paths','file_diff','apply_patch',
              'file_artifact','ssh_check','ssh_exec','ssh_upload','ssh_download'
          }
          assert not (required - set(tools)), sorted(required - set(tools))
          PY
          test ! -e scripts/apply_agent_ops_surface.py

      - name: Commit validated alpha4 candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No transformed changes produced'; exit 1; }
          git commit -m 'feat: add bounded agent-native operations'
          git push origin HEAD:feature/agent-native-ops-20260913
