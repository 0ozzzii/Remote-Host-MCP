name: Remote Host MCP compatibility validation

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "VERSION"
      - ".github/workflows/compatibility-validation.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "VERSION"
      - ".github/workflows/compatibility-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip check
      - name: Test
        run: pytest -q --tb=short
      - name: Compile
        run: python -m compileall -q src tests scripts/secret_scan.py
