name: Remote Host MCP security validation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch reachable repository refs
        run: |
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan current tree and Git history
        run: python scripts/secret_scan.py --git-history

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install isolated audit environment
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install 'pip-audit>=2.9,<3'
          pip check
      - name: Audit installed dependencies
        run: pip-audit --local --progress-spinner off
