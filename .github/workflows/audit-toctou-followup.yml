name: Audit TOCTOU follow-up

on:
  push:
    branches:
      - hardening/audit-closure-20260913

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final TOCTOU follow-up
        run: python scripts/patch_toctou_followup.py
      - name: Install candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Targeted audit closure
        run: pytest -q --tb=short tests/test_audit_closure.py tests/test_process_redaction.py tests/test_process_redaction_tail.py tests/test_service_diagnostics.py
      - name: Full pytest
        run: pytest -q --tb=short
      - name: Compile
        run: python -m compileall -q src tests
      - name: Static hygiene
        run: |
          ! grep -R --line-number --exclude='*.pyc' --exclude-dir='__pycache__' --exclude-dir='*.egg-info' -E 'pkill|killall|/proc/.*/environ' src tests
          git diff --check
      - name: Commit validated follow-up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: preserve concurrent filesystem writers during atomic commits'
          git push origin HEAD:hardening/audit-closure-20260913
