name: Remote Host MCP package validation

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "README.md"
      - "LICENSE"
      - "pyproject.toml"
      - "VERSION"
      - ".github/workflows/package-validation.yml"
  pull_request:
    paths:
      - "src/**"
      - "README.md"
      - "LICENSE"
      - "pyproject.toml"
      - "VERSION"
      - ".github/workflows/package-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build source and wheel artifacts
        run: |
          python -m pip install --upgrade pip
          pip install 'build>=1.2,<2' 'twine>=6,<7'
          python -m build
          python -m twine check dist/*
          sha256sum dist/* | tee dist/SHA256SUMS
      - name: Verify package metadata and license
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheels=list(pathlib.Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as zf:
              names=zf.namelist()
              assert any(name.endswith('.dist-info/METADATA') for name in names)
              assert any('/licenses/LICENSE' in name or name.endswith('.dist-info/LICENSE') for name in names), names
          PY
      - name: Install built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import importlib.metadata
          import remote_host_mcp
          assert importlib.metadata.version('remote-host-mcp') == remote_host_mcp.__version__
          print(remote_host_mcp.__version__)
          PY
          "$RUNNER_TEMP/wheel-venv/bin/remote-host-mcp-doctor" --help >/dev/null
